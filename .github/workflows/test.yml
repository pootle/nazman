name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -q

  drift:
    # main is a release label: its tree must always equal dev's. This job runs
    # on every main push and fails if they differ, so the branches cannot fall
    # out of sync.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Fetch dev
        run: git fetch --depth=1 origin dev

      - name: Fail if main differs from dev
        run: |
          if ! git diff --exit-code --stat FETCH_HEAD HEAD; then
            echo "::error::main tree differs from dev; merge dev into main to release"
            exit 1
          fi
          echo "main and dev trees are identical."
