<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NAZMan{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-database"></i>
                <span>NAZMan</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/disks" class="nav-link {% if request.url.path == '/disks' %}active{% endif %}">
                        <i class="fas fa-hdd"></i>
                        <span>Disks</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/pools" class="nav-link {% if request.url.path == '/pools' %}active{% endif %}">
                        <i class="fas fa-layer-group"></i>
                        <span>Pools</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/monitoring" class="nav-link {% if request.url.path == '/monitoring' %}active{% endif %}">
                        <i class="fas fa-chart-line"></i>
                        <span>Performance</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/datasets" class="nav-link {% if request.url.path == '/datasets' %}active{% endif %}">
                        <i class="fas fa-folder-open"></i>
                        <span>Datasets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/nfs" class="nav-link {% if request.url.path == '/nfs' %}active{% endif %}">
                        <i class="fas fa-network-wired"></i>
                        <span>NFS</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/smb" class="nav-link {% if request.url.path == '/smb' %}active{% endif %}">
                        <i class="fas fa-share-nodes"></i>
                        <span>SMB</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/snapshots" class="nav-link {% if request.url.path == '/snapshots' %}active{% endif %}">
                        <i class="fas fa-camera"></i>
                        <span>Snapshots</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/backup" class="nav-link {% if request.url.path == '/backup' %}active{% endif %}">
                        <i class="fas fa-save"></i>
                        <span>Backup</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/events" class="nav-link {% if request.url.path == '/events' %}active{% endif %}">
                        <i class="fas fa-terminal"></i>
                        <span>Command Log</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/settings" class="nav-link {% if request.url.path == '/settings' %}active{% endif %}">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="header">
                <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                <div class="header-actions">
                    <button class="btn btn-icon" id="refresh-btn" title="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn btn-icon" id="logout-btn" title="Sign out" style="display:none">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 360px">
            <div class="modal-header">
                <h2>Sign in</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                    <div id="login-error" class="form-hint" style="color: #e74c3c; display: none;"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-primary" id="login-btn">Sign in</button>
            </div>
        </div>
    </div>

    <script src="/static/js/charts.js?v=3"></script>
    <script src="/static/js/api.js?v=4"></script>
    <script src="/static/js/components.js?v=3"></script>
    <script src="/static/js/app.js?v=3"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
