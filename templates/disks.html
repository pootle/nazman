{% extends "base.html" %}

{% block title %}Disks - NAZMan{% endblock %}
{% block page_title %}Disk Management{% endblock %}

{% block content %}
<div class="disks-page">
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-hdd"></i> Disks</h2>
            <div style="display:flex;gap:8px;align-items:center">
                <button class="btn btn-primary" id="partition-btn" style="display:none" onclick="openPartitionModal()">
                    <i class="fas fa-cut"></i> Partition Selected
                </button>
                <button class="btn btn-secondary" onclick="refreshDisks()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>
        <div class="card-body">
            <div id="disks-table">
                <p class="loading">Loading disks...</p>
            </div>
        </div>
    </div>
</div>

<!-- Partition Modal -->
<div id="partition-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width:600px">
        <div class="modal-header">
            <h3 id="partition-modal-title">Partition Disks</h3>
            <button class="close" onclick="hidePartitionModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="partition-disk-info"></p>
            <div class="form-group">
                <label>Partitions:</label>
                <div id="partition-rows"></div>
                <button type="button" class="btn btn-sm btn-secondary" onclick="addPartitionRow()" style="margin-top:6px">
                    <i class="fas fa-plus"></i> Add Partition
                </button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="wipeAndPartitionSelected()" id="partition-submit-btn">
                    <i class="fas fa-cut"></i> Wipe &amp; Partition
                </button>
                <button class="btn btn-warning" onclick="wipeOnlySelected()" id="partition-wipe-btn">
                    <i class="fas fa-eraser"></i> Wipe Only
                </button>
                <button class="btn btn-secondary" onclick="hidePartitionModal()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Disk Details Modal -->
<div id="disk-detail-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width:900px">
        <div class="modal-header">
            <h3 id="disk-detail-title">Disk Details</h3>
            <button class="close" onclick="closeDiskDetails()">&times;</button>
        </div>
        <div class="modal-body" id="disk-detail-body">
            <div class="disk-detail-grid">
                <div class="detail-col">
                    <div class="disk-detail-section">
                        <h4>Device</h4>
                        <div id="dd-summary"></div>
                    </div>
                    <div class="disk-detail-section">
                        <h4>SMART</h4>
                        <div id="dd-smart"></div>
                    </div>
                </div>
                <div class="detail-col">
                    <div class="disk-detail-section">
                        <h4>ZFS Error History</h4>
                        <div id="dd-zfs"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let disks = [];

document.addEventListener('DOMContentLoaded', function() {
    loadDisksPage();
});

async function loadDisksPage() {
    try {
        disks = await api.getDisks();
        renderDisks();
    } catch (error) {
        console.error('Failed to load disks:', error);
    }
}

function refreshDisks() {
    loadDisksPage();
}

function renderDisks() {
    const container = document.getElementById('disks-table');

    if (disks.length === 0) {
        container.innerHTML = '<p class="empty-state">No disks found.</p>';
        return;
    }

    const sorted = [...disks].sort((a, b) => (diskSortRank(a) - diskSortRank(b)) || (a.id - b.id));

    let html = `
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width:32px"></th>
                    <th>Device</th>
                    <th>Model</th>
                    <th>Size</th>
                    <th>Type</th>
                    <th>Health</th>
                    <th>Parts</th>
                    <th>Free</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${sorted.map(diskRow).join('')}
            </tbody>
        </table>`;

    container.innerHTML = html;

    document.querySelectorAll('.disk-cb').forEach(cb => {
        cb.addEventListener('change', updatePartitionButton);
    });
}

function diskSortRank(disk) {
    if (disk.status === 'dead' || disk.status === 'removed') return 3;
    if (diskHealthState(disk) === 'attention') return 2;
    if (disk.is_os_disk) return 1;
    return 0;
}

function diskRow(disk) {
    const isDead = disk.status === 'dead';
    const isRemoved = disk.status === 'removed';
    const present = !isDead && !isRemoved && !!disk.device_name;
    const label = disk.device_name || (disk.by_id || '').replace('/dev/disk/by-id/', '') || disk.serial || 'Unknown';
    const absentBadge = (!disk.device_name && !isDead) ? '<span class="badge badge-removed">not present</span>' : '';

    return `
        <tr class="${isDead ? 'dead-row' : (isRemoved ? 'removed-row' : '')}" data-disk-id="${disk.id}">
            <td>${present ? `<input type="checkbox" class="disk-cb" value="${disk.id}">` : ''}</td>
            <td>
                <a href="javascript:void(0)" onclick="openDiskDetails(${disk.id}); return false;" title="View details">${label}</a>
                ${absentBadge} ${isRemoved ? '<span class="badge badge-removed">removed</span>' : ''}
            </td>
            <td>${disk.model || 'Unknown'}</td>
            <td>${formatBytes(disk.size_bytes)}</td>
            <td><span class="badge badge-${disk.disk_type}">${disk.disk_type}</span></td>
            <td>${healthCell(disk)}</td>
            <td>${present ? (disk.partition_count || 0) : '—'}</td>
            <td>${freeSpaceCell(disk)}</td>
            <td>${roleBadge(disk)}</td>
            <td>${actionButtons(disk)}</td>
        </tr>`;
}

function zfsErrorTotal(disk) {
    const e = disk.zfs_errors;
    return e ? (e.cksum || 0) + (e.read || 0) + (e.write || 0) : 0;
}

function diskHealthState(disk) {
    if (disk.status === 'dead') return 'dead';
    if (disk.status === 'removed') return 'removed';
    if (!disk.device_name) return 'absent';
    if (disk.health_status === 'failing' || zfsErrorTotal(disk) > 0) return 'attention';
    return disk.health_status === 'ok' ? 'ok' : 'unknown';
}

function healthCell(disk) {
    const state = diskHealthState(disk);
    if (state === 'attention') {
        const bits = [];
        if (disk.health_status === 'failing') bits.push('SMART: failing');
        const e = disk.zfs_errors || {};
        if (e.cksum) bits.push(`ZFS checksum: ${e.cksum}`);
        if (e.read) bits.push(`ZFS read: ${e.read}`);
        if (e.write) bits.push(`ZFS write: ${e.write}`);
        return `<span class="badge badge-health-attention" title="${escapeHtml(bits.join('; ') || 'problems detected')}">
            <i class="fas fa-exclamation-triangle"></i> Attention</span>`;
    }
    if (state === 'dead') return '<span class="status status-dead">Dead</span>';
    if (state === 'removed' || state === 'absent') return '<span class="badge badge-removed">not present</span>';
    if (state === 'unknown') return '<span class="status status-unknown">Unknown</span>';
    return '<span class="status status-ok">OK</span>';
}

function freeSpaceCell(disk) {
    if (disk.role === 'backup') {
        return `<span class="badge badge-state-${disk.backup_state || 'unknown'}">${disk.backup_state || 'unknown'}</span>`;
    }
    if (typeof disk.free_percent !== 'number') return '—';
    const pct = Math.round(disk.free_percent);
    const color = pct < 25 ? '#e74c3c' : (pct < 50 ? '#f39c12' : '#27ae60');
    return `
        <div style="min-width:100px">
            <div style="background:#444;border-radius:4px;height:8px;overflow:hidden;margin-bottom:3px">
                <div style="width:${pct}%;background:${color};height:100%"></div>
            </div>
            <small class="text-muted" title="Space not allocated to any partition">${pct}% free</small>
        </div>`;
}

function roleBadge(disk) {
    switch (disk.role) {
        case 'pool': {
            const pools = disk.pools && disk.pools.length ? disk.pools : [disk.role_detail || '?'];
            let badge = `<span class="badge badge-role-pool" title="Free space shown is per-disk (unallocated)">Pool: ${escapeHtml(pools[0])}</span>`;
            if (pools.length > 1) {
                const others = pools.slice(1).join(', ');
                badge += ` <span class="badge badge-role-more" title="Also a member of: ${escapeHtml(others)}">+${pools.length - 1}</span>`;
            }
            return badge;
        }
        case 'backup':
            return disk.role_detail
                ? `<span class="badge badge-role-backup">Backup: ${disk.role_detail}</span>`
                : '<span class="badge badge-role-backup">Backup</span>';
        case 'system':
            return '<span class="badge badge-role-system">System</span>';
        case 'dead':
            return '<span class="badge badge-role-dead">Dead</span>';
        case 'removed':
            return '<span class="badge badge-role-removed">Removed</span>';
        default:
            return '<span class="badge badge-role-unused">Unused</span>';
    }
}

function actionButtons(disk) {
    const isDead = disk.status === 'dead';
    const isRemoved = disk.status === 'removed';
    const present = !isDead && !isRemoved && !!disk.device_name;
    let out = `<button class="btn btn-sm btn-secondary" onclick="openDiskDetails(${disk.id})">
        <i class="fas fa-info-circle"></i> Details</button> `;
    if (isDead) {
        out += `<button class="btn btn-sm btn-primary" onclick="resurrectDisk(${disk.id})">Resurrect</button>`;
    } else if (!isRemoved && present) {
        out += `<button class="btn btn-sm btn-danger" onclick="markDead(${disk.id})">Dead</button>`;
    }
    if (isRemoved || !present) {
        out += `<button class="btn btn-sm btn-secondary" onclick="dropDisk(${disk.id})">Drop</button>`;
    }
    return out;
}

function updatePartitionButton() {
    const checked = document.querySelectorAll('.disk-cb:checked');
    const btn = document.getElementById('partition-btn');
    btn.style.display = checked.length > 0 ? '' : 'none';
    btn.innerHTML = checked.length > 1
        ? `<i class="fas fa-cut"></i> Partition ${checked.length} Disks`
        : `<i class="fas fa-cut"></i> Partition Selected`;
}

// ── Partition Modal ──────────────────────────────────────────

let selectedDiskIds = [];

function openPartitionModal() {
    selectedDiskIds = [...document.querySelectorAll('.disk-cb:checked')].map(cb => parseInt(cb.value));
    if (selectedDiskIds.length === 0) return;

    const title = document.getElementById('partition-modal-title');
    if (selectedDiskIds.length === 1) {
        const disk = disks.find(d => d.id === selectedDiskIds[0]);
        title.textContent = `Partition ${disk.device_name}`;
        document.getElementById('partition-disk-info').innerHTML =
            `<strong>${disk.device_name}</strong> — ${formatBytes(disk.size_bytes)} ${disk.disk_type}`;
    } else {
        title.textContent = `Partition ${selectedDiskIds.length} Disks`;
        const names = selectedDiskIds.map(id => disks.find(d => d.id === id)?.device_name).filter(Boolean);
        document.getElementById('partition-disk-info').innerHTML =
            `Applying same layout to: <strong>${names.join(', ')}</strong>`;
    }

    document.getElementById('partition-rows').innerHTML = '';
    addPartitionRow('');
    document.getElementById('partition-modal').style.display = 'flex';
}

function hidePartitionModal() {
    document.getElementById('partition-modal').style.display = 'none';
    selectedDiskIds = [];
}

function addPartitionRow(size = '') {
    const container = document.getElementById('partition-rows');
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '8px';
    row.style.marginBottom = '6px';
    row.style.alignItems = 'center';
    row.innerHTML = `
        <input type="text" class="form-control part-size" placeholder="Size (e.g. 10G, 500M, empty = rest)" value="${size}" style="flex:1">
        <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">
            <i class="fas fa-times"></i>
        </button>
    `;
    container.appendChild(row);
}

function parseSizeToMB(str) {
    const match = str.match(/^(\d+(?:\.\d+)?)\s*(T|G|M|K)?$/i);
    if (!match) return null;
    const value = parseFloat(match[1]);
    const unit = (match[2] || 'M').toUpperCase();
    const multipliers = { T: 1024 * 1024, G: 1024, M: 1, K: 1 / 1024 };
    return Math.round(value * (multipliers[unit] || 1));
}

async function wipeAndPartitionSelected() {
    if (selectedDiskIds.length === 0) return;

    const rows = document.querySelectorAll('#partition-rows .part-size');
    const partitions = [];
    for (const row of rows) {
        const sizeStr = row.value.trim();
        let size_mb = null;
        if (sizeStr) {
            size_mb = parseSizeToMB(sizeStr);
            if (size_mb === null) {
                showAlert(`Invalid size: "${sizeStr}". Use formats like 10G, 500M, 1T.`, 'error');
                return;
            }
        }
        partitions.push({ size_mb });
    }

    if (partitions.length === 0) {
        return wipeOnlySelected();
    }

    const names = selectedDiskIds.map(id => disks.find(d => d.id === id)?.device_name).filter(Boolean);
    const label = names.length === 1 ? names[0] : `${names.length} disks (${names.join(', ')})`;
    if (!confirm(`Wipe and create ${partitions.length} partition(s) on ${label}?`)) return;

    try {
        const results = await api.batchPartitionDisks({ disk_ids: selectedDiskIds, partitions });
        const failed = results.filter(r => !r.success);
        hidePartitionModal();
        await loadDisksPage();
        if (failed.length === 0) {
            showAlert(`Partitioned ${names.length} disk(s)`, 'success');
        } else {
            const msgs = failed.map(f => `Disk ${f.disk_id}: ${f.error}`).join('; ');
            showAlert(`Partitioned ${names.length - failed.length}/${names.length} disk(s). Failures: ${msgs}`, 'warning');
        }
    } catch (error) {
        showAlert('Failed: ' + error.message, 'error');
    }
}

async function wipeOnlySelected() {
    if (selectedDiskIds.length === 0) return;

    const names = selectedDiskIds.map(id => disks.find(d => d.id === id)?.device_name).filter(Boolean);
    const label = names.length === 1 ? names[0] : `${names.length} disks (${names.join(', ')})`;
    if (!confirm(`Wipe all partition tables on ${label}? This removes all partitions.`)) return;

    try {
        const results = await api.batchWipeDisks({ disk_ids: selectedDiskIds, partitions: [] });
        const failed = results.filter(r => !r.success);
        hidePartitionModal();
        await loadDisksPage();
        if (failed.length === 0) {
            showAlert(`Wiped ${names.length} disk(s)`, 'success');
        } else {
            const msgs = failed.map(f => `Disk ${f.disk_id}: ${f.error}`).join('; ');
            showAlert(`Wiped ${names.length - failed.length}/${names.length} disk(s). Failures: ${msgs}`, 'warning');
        }
    } catch (error) {
        showAlert('Failed: ' + error.message, 'error');
    }
}

// ── Disk Details Modal ───────────────────────────────────────

async function openDiskDetails(diskId) {
    const disk = disks.find(d => d.id === diskId);
    if (!disk) return;
    document.getElementById('disk-detail-title').textContent = `Details — ${disk.device_name || disk.serial || 'Disk #' + diskId}`;
    const body = document.getElementById('disk-detail-body');
    body.innerHTML = '<p class="loading">Loading details...</p>';
    document.getElementById('disk-detail-modal').style.display = 'flex';

    let payload;
    try {
        payload = await api.getDiskHealth(diskId);
    } catch (error) {
        body.innerHTML = `<p class="empty-hint">Failed to load details: ${escapeHtml(error.message)}</p>`;
        return;
    }
    try {
        renderDiskDetails(payload);
    } catch (error) {
        console.error('Failed to render disk details', error);
        body.innerHTML = `<p class="empty-hint">Failed to render details: ${escapeHtml(error.message)}</p>`;
    }
}

function closeDiskDetails() {
    document.getElementById('disk-detail-modal').style.display = 'none';
}

function renderDiskDetails(payload) {
    const body = document.getElementById('disk-detail-body');
    body.innerHTML = `
        <div class="disk-detail-grid">
            <div class="detail-col">
                <div class="disk-detail-section">
                    <h4>Device</h4>
                    <div id="dd-summary"></div>
                </div>
                <div class="disk-detail-section">
                    <h4>SMART</h4>
                    <div id="dd-smart"></div>
                </div>
            </div>
            <div class="detail-col">
                <div class="disk-detail-section">
                    <h4>ZFS Error History</h4>
                    <div id="dd-zfs"></div>
                </div>
            </div>
        </div>`;

    const d = payload.disk || {};
    const deviceId = (d.by_id || '').replace('/dev/disk/by-id/', '') || 'unavailable';

    const roleRows = (function () {
        if (d.role === 'pool') {
            const pools = d.pools && d.pools.length ? d.pools : [d.role_detail || '?'];
            return pools.map(p =>
                `<div style="margin-bottom:6px"><span class="detail-key">Role</span><span class="detail-val">Pool: ${escapeHtml(p)}</span></div>`).join('');
        }
        return `<div style="margin-bottom:6px"><span class="detail-key">Role</span><span class="detail-val">${escapeHtml(d.role || '—')}</span></div>`;
    })();

    document.getElementById('dd-summary').innerHTML = `
        <div style="margin-bottom:6px"><span class="detail-key">Device</span><span class="detail-val">${escapeHtml(d.device_name || '—')}</span></div>
        <div style="margin-bottom:6px"><span class="detail-key">Model</span><span class="detail-val">${escapeHtml(d.model || 'Unknown')}</span></div>
        <div style="margin-bottom:6px"><span class="detail-key">Serial</span><span class="detail-val">${escapeHtml(d.serial || '—')}</span></div>
        <div style="margin-bottom:6px"><span class="detail-key">Device ID</span><span class="detail-val mono">${escapeHtml(deviceId)}</span></div>
        <div style="margin-bottom:6px"><span class="detail-key">Size</span><span class="detail-val">${formatBytes(d.size_bytes)}</span></div>
        <div style="margin-bottom:6px"><span class="detail-key">Type</span><span class="detail-val">${escapeHtml(d.disk_type || '—')}</span></div>
        ${roleRows}
        <div><span class="detail-key">Health</span><span class="detail-val">${healthCell(d)}</span></div>`;

    renderSmartSection(payload.smart);
    renderZfsSection(payload.zfs);
}

function renderSmartSection(smart) {
    const el = document.getElementById('dd-smart');
    if (!smart) {
        el.innerHTML = '<p class="empty-hint">No SMART data available (disk not present or no device path).</p>';
        return;
    }
    const parts = [];
    const status = smart.health_status === 'failing'
        ? '<span class="status status-failing">Failing</span>'
        : (smart.health_status === 'ok' ? '<span class="status status-ok">OK</span>' : '<span class="status status-unknown">Unknown</span>');
    parts.push(`<div style="margin-bottom:6px"><span class="detail-key">Overall health</span><span class="detail-val">${status}</span></div>`);
    if (smart.temperature !== null && smart.temperature !== undefined) {
        parts.push(`<div style="margin-bottom:6px"><span class="detail-key">Temperature</span><span class="detail-val">${escapeHtml(smart.temperature)} °C</span></div>`);
    }
    if (smart.power_on_hours !== null && smart.power_on_hours !== undefined) {
        parts.push(`<div style="margin-bottom:6px"><span class="detail-key">Power-on hours</span><span class="detail-val">${escapeHtml(smart.power_on_hours)}</span></div>`);
    }
    if (smart.nvme) {
        parts.push(`<div style="margin-bottom:6px"><span class="detail-key">NVMe</span><span class="detail-val">warning ${escapeHtml(smart.nvme.critical_warning)} &middot; used ${escapeHtml(smart.nvme.percentage_used)}% &middot; media errors ${escapeHtml(smart.nvme.media_errors)}</span></div>`);
    }

    if (smart.problems && smart.problems.length) {
        parts.push('<div style="margin-bottom:6px"><span class="detail-key">Problems</span><div class="detail-val">'
            + smart.problems.map(p => `<p class="problem-item problem-warn">${escapeHtml(p)}</p>`).join('')
            + '</div></div>');
    } else if (smart.attributes && smart.attributes.length) {
        parts.push('<p class="empty-hint" style="margin:4px 0 8px">No SMART problems detected.</p>');
    }

    if (smart.attributes && smart.attributes.length) {
        parts.push('<table class="smart-attr-table"><thead><tr><th>Attr</th><th>Value</th><th>Worst</th><th style="text-align:right">Raw</th><th></th></tr></thead><tbody>'
            + smart.attributes.map(a => {
                const bad = a.when_failed
                    ? `<span class="problem-fatal" title="${escapeHtml(a.when_failed)}">FAILED</span>`
                    : (a.raw ? '<span class="problem-warn">attention</span>' : '');
                return `<tr><td>${escapeHtml(a.name || a.id)}</td><td class="num">${a.value ?? '—'}</td><td class="num">${a.worst ?? '—'}</td><td class="num" style="text-align:right">${a.raw ?? '—'}</td><td>${bad}</td></tr>`;
            }).join('')
            + '</tbody></table>');
    }

    if (smart.self_test && smart.self_test.length) {
        parts.push('<h4 style="margin:12px 0 6px;font-size:12px;color:#777;text-transform:uppercase">Self-test log</h4>'
            + '<table class="event-table"><thead><tr><th>Type</th><th>Status</th><th>Remaining</th><th>Hours</th></tr></thead><tbody>'
            + smart.self_test.map(t => `<tr><td>${escapeHtml(t.type || '—')}</td><td class="${t.failed ? 'problem-fatal' : ''}">${escapeHtml(t.status)}</td><td>${escapeHtml(t.remaining ?? '—')}</td><td class="num">${escapeHtml(t.lifetime_hours ?? '—')}</td></tr>`).join('')
            + '</tbody></table>');
    }

    el.innerHTML = parts.join('');
}

function renderZfsSection(zfs) {
    const el = document.getElementById('dd-zfs');
    if (!zfs || (zfs.pool === null && !zfs.errors && (!zfs.events || zfs.events.length === 0))) {
        el.innerHTML = '<p class="empty-hint">This disk is not part of a ZFS pool.</p>';
        return;
    }
    const parts = [];
    if (zfs.pool !== null && zfs.pool !== undefined) {
        parts.push(`<div style="margin-bottom:6px"><span class="detail-key">Pool</span><span class="detail-val">${escapeHtml(zfs.pool)}</span></div>`);
    }
    const e = zfs.errors;
    if (e !== null && e !== undefined) {
        const total = (e.cksum || 0) + (e.read || 0) + (e.write || 0);
        const statusHtml = total > 0
            ? '<span class="badge badge-health-attention">Errors detected</span>'
            : '<span class="status status-ok">No errors</span>';
        parts.push(`<div style="margin-bottom:8px"><span class="detail-key">Counters</span><span class="detail-val">${statusHtml}</span></div>`);
        parts.push('<table class="event-table"><tbody>'
            + `<tr><td>Read errors</td><td class="num">${e.read || 0}</td></tr>`
            + `<tr><td>Write errors</td><td class="num">${e.write || 0}</td></tr>`
            + `<tr><td>Checksum errors</td><td class="num">${e.cksum || 0}</td></tr>`
            + '</tbody></table>');
    }

    parts.push('<h4 style="margin:12px 0 6px;font-size:12px;color:#777;text-transform:uppercase">Recent ZFS error events</h4>');
    if (zfs.events && zfs.events.length) {
        parts.push('<table class="event-table"><thead><tr><th>Time</th><th>Event</th></tr></thead><tbody>'
            + zfs.events.slice(0, 50).map(ev => `<tr><td class="mono num">${escapeHtml(formatEventTime(ev.time))}</td><td>${escapeHtml(shortEventClass(ev.class))}</td></tr>`).join('')
            + '</tbody></table>');
    } else {
        parts.push('<p class="empty-hint">No recent ZFS error events recorded for this disk.</p>');
    }
    if (zfs.pool) {
        parts.push('<p class="empty-hint" style="margin-top:8px">Counters are cumulative since the last <code>zpool clear</code>; events cover only activity retained in the recent ring buffer.</p>');
    }
    el.innerHTML = parts.join('');
}

function formatEventTime(t) {
    if (!t) return '—';
    const date = new Date(t);
    return isNaN(date.getTime()) ? t : date.toLocaleString();
}

function shortEventClass(cls) {
    return (cls || '').split('.').pop();
}

// ── Disk Actions ─────────────────────────────────────────────

async function markDead(diskId) {
    const disk = disks.find(d => d.id === diskId);
    if (!confirm(`Mark ${disk.device_name} as dead?`)) return;
    try {
        await api.updateDisk(diskId, { status: 'dead' });
        showAlert(`${disk.device_name} marked as dead`, 'success');
        await loadDisksPage();
    } catch (error) {
        showAlert('Failed: ' + error.message, 'error');
    }
}

async function resurrectDisk(diskId) {
    try {
        await api.resurrectDisk(diskId);
        showAlert('Disk resurrected', 'success');
        await loadDisksPage();
    } catch (error) {
        showAlert('Failed: ' + error.message, 'error');
    }
}

async function dropDisk(diskId) {
    const disk = disks.find(d => d.id === diskId);
    if (!confirm(`Permanently drop ${disk.model || disk.serial || disk.by_id || disk.id} from the database?`)) return;
    try {
        await api.deleteDisk(diskId);
        showAlert('Disk record dropped', 'success');
        await loadDisksPage();
    } catch (error) {
        showAlert('Failed: ' + error.message, 'error');
    }
}
