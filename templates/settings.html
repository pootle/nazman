{% extends "base.html" %}

{% block title %}Settings - NAZMan{% endblock %}
{% block page_title %}System Settings{% endblock %}

{% block content %}
<div class="settings-page">
    <!-- System Information -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-info-circle"></i> System Information</h2>
        </div>
        <div class="card-body">
            <div id="system-info" class="info-grid">
                <p class="loading">Loading system information...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadSystemInfo();
});

async function loadSystemInfo() {
    try {
        const status = await api.getSystemStatus();
        renderSystemInfo(status);
    } catch (error) {
        console.error('Failed to load system info:', error);
        showError('system-info', 'Failed to load system information');
    }
}

function renderSystemInfo(status) {
    const container = document.getElementById('system-info');
    
    container.innerHTML = `
        <div class="info-grid">
            <div class="info-item">
                <label>CPU Usage:</label>
                <span>${escapeHtml(status.system.cpu_percent)}%</span>
            </div>
            <div class="info-item">
                <label>Memory:</label>
                <span>${escapeHtml(status.system.memory.percent)}% (${formatBytes(status.system.memory.available)} free)</span>
            </div>
            <div class="info-item">
                <label>OS Disk:</label>
                <span>${escapeHtml(status.system.disk.percent)}% (${formatBytes(status.system.disk.free)} free)</span>
            </div>
            <div class="info-item">
                <label>ZFS Pools:</label>
                <span>${escapeHtml(status.storage.pool_count)}</span>
            </div>
            <div class="info-item">
                <label>Disks:</label>
                <span>${escapeHtml(status.storage.disk_count)}</span>
            </div>
        </div>
    `;
}

function showError(elementId, message) {
    const container = document.getElementById(elementId);
    container.innerHTML = `<p class="error"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(message)}</p>`;
}
</script>
{% endblock %}
